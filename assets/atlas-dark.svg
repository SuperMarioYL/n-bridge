<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="Architecture: AI agent -stdio-> N-Bridge MCP server -fanout-> Google accounts; OS keychain feeds refresh tokens">
  <defs>
    <marker id="ah-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A5A66"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#1D1D1F"/>

  <g stroke="#3A3A44" stroke-width="1.5" fill="none">
    <line x1="210" y1="180" x2="349" y2="180" marker-end="url(#ah-d)"/>
    <line x1="525" y1="180" x2="664" y2="180" marker-end="url(#ah-d)"/>
    <line x1="440" y1="270" x2="440" y2="226" marker-end="url(#ah-d)"/>
  </g>

  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="210" y1="180" x2="345" y2="180" stroke="#8985FF" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="525" y1="180" x2="660" y2="180" stroke="#2DC79A" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="440" y1="268" x2="440" y2="228" stroke="#4DA3FF" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.4s" repeatCount="indefinite"/>
    </line>
  </g>

  <g>
    <circle r="3" fill="#8985FF">
      <animateMotion path="M210,180 L345,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#2DC79A">
      <animateMotion path="M525,180 L660,180" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#4DA3FF">
      <animateMotion path="M440,268 L440,228" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <rect x="40" y="140" width="170" height="80" rx="15" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#C9C7FF">AI Agent</text>
    <text x="125" y="198" text-anchor="middle" font-size="11" fill="#A1A1A8">Claude Code · Codex</text>

    <rect x="355" y="140" width="170" height="80" rx="15" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#BDDDFF">N-Bridge</text>
    <text x="440" y="198" text-anchor="middle" font-size="11" fill="#A1A1A8">MCP server · fanout</text>

    <rect x="670" y="140" width="170" height="80" rx="15" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="755" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#9BE9CC">Google accounts</text>
    <text x="755" y="198" text-anchor="middle" font-size="11" fill="#A1A1A8">Gmail · Calendar · Drive</text>

    <rect x="355" y="270" width="170" height="60" rx="15" fill="#A1A1A8" fill-opacity="0.16" stroke="#A1A1A8" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.22;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-1.7s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="303" text-anchor="middle" font-size="13" font-weight="600" fill="#C9C9D0">OS keychain</text>
    <text x="440" y="320" text-anchor="middle" font-size="10" fill="#A1A1A8">refresh tokens (never on disk)</text>
  </g>

  <g font-size="10" fill="#A1A1A8" text-anchor="middle">
    <text x="280" y="172">stdio</text>
    <text x="595" y="172">fanout</text>
    <text x="450" y="252" text-anchor="start">tokens</text>
  </g>
</svg>
