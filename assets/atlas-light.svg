<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="Architecture: AI agent -stdio-> N-Bridge MCP server -fanout-> Google accounts; OS keychain feeds refresh tokens">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- static connectors -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="210" y1="180" x2="349" y2="180" marker-end="url(#ah-l)"/>
    <line x1="525" y1="180" x2="664" y2="180" marker-end="url(#ah-l)"/>
    <line x1="440" y1="270" x2="440" y2="226" marker-end="url(#ah-l)"/>
  </g>

  <!-- marching-dash data flow (direction = data direction) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="210" y1="180" x2="345" y2="180" stroke="#5E5CE6" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="525" y1="180" x2="660" y2="180" stroke="#10A37F" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="440" y1="268" x2="440" y2="228" stroke="#0071E3" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- data packets -->
  <g>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M210,180 L345,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#10A37F">
      <animateMotion path="M525,180 L660,180" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M440,268 L440,228" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes -->
  <g>
    <rect x="40" y="140" width="170" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#4B3FC4">AI Agent</text>
    <text x="125" y="198" text-anchor="middle" font-size="11" fill="#6E6E73">Claude Code · Codex</text>

    <rect x="355" y="140" width="170" height="80" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#0A4F9E">N-Bridge</text>
    <text x="440" y="198" text-anchor="middle" font-size="11" fill="#6E6E73">MCP server · fanout</text>

    <rect x="670" y="140" width="170" height="80" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="755" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#0B6B53">Google accounts</text>
    <text x="755" y="198" text-anchor="middle" font-size="11" fill="#6E6E73">Gmail · Calendar · Drive</text>

    <rect x="355" y="270" width="170" height="60" rx="15" fill="#6E6E73" fill-opacity="0.10" stroke="#6E6E73" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.16;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.7s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="303" text-anchor="middle" font-size="13" font-weight="600" fill="#3A3A44">OS keychain</text>
    <text x="440" y="320" text-anchor="middle" font-size="10" fill="#6E6E73">refresh tokens (never on disk)</text>
  </g>

  <!-- connector labels -->
  <g font-size="10" fill="#6E6E73" text-anchor="middle">
    <text x="280" y="172">stdio</text>
    <text x="595" y="172">fanout</text>
    <text x="450" y="252" text-anchor="start">tokens</text>
  </g>
</svg>
